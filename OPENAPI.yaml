openapi: 3.0.3
info:
  title: AI Studio API
  description: API for AI Studio - A mini AI image generation platform
  version: 1.0.0
  contact:
    email: support@aistudio.com

servers:
  - url: http://localhost:3001
    description: Local development server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Generations
    description: Image generation endpoints

paths:
  /auth/signup:
    post:
      tags:
        - Auth
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: password123
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User created successfully
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login to existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /generations:
    post:
      tags:
        - Generations
      summary: Create a new generation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - prompt
                - style
                - image
              properties:
                prompt:
                  type: string
                  maxLength: 500
                  example: A beautiful sunset over the ocean
                style:
                  type: string
                  example: Realistic
                image:
                  type: string
                  format: binary
                  description: Image file (JPEG/PNG, max 10MB)
      responses:
        '201':
          description: Generation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Generation created successfully
                  generation:
                    $ref: '#/components/schemas/Generation'
        '400':
          description: Validation error or missing image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Model overloaded (20% chance)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Model overloaded

    get:
      tags:
        - Generations
      summary: Get user's recent generations
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
            maximum: 50
          description: Number of generations to retrieve
      responses:
        '200':
          description: List of generations
          content:
            application/json:
              schema:
                type: object
                properties:
                  generations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Generation'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@example.com

    Generation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        prompt:
          type: string
          example: A beautiful sunset over the ocean
        style:
          type: string
          example: Realistic
        imageUrl:
          type: string
          example: /uploads/image-1234567890.jpg
        originalImageUrl:
          type: string
          example: /uploads/image-1234567890.jpg
        status:
          type: string
          example: completed
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T12:00:00Z

    Error:
      type: object
      properties:
        message:
          type: string
          example: Validation error
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Invalid email format
